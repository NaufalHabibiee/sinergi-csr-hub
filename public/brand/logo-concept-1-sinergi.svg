<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" fill="none">
  <defs>
    <linearGradient id="gradLeaf1" x1="12" y1="12" x2="78" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="50%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#0E4D36" />
    </linearGradient>
    <linearGradient id="gradLeaf2" x1="78" y1="18" x2="18" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#176B4D" />
      <stop offset="100%" stopColor="#064E3B" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Emblem: Infinity Leaf / Sinergi Loop -->
  <g filter="url(#subtleGlow)">
    <!-- Loop Left -->
    <path
      d="M32 48 C 16 32, 16 18, 34 18 C 50 18, 62 38, 76 54 C 88 68, 92 78, 76 78 C 60 78, 48 62, 32 48 Z"
      fill="url(#gradLeaf1)"
    />
    <!-- Loop Right & Leaf Accent -->
    <path
      d="M58 48 C 74 64, 74 78, 56 78 C 40 78, 28 58, 14 42 C 2 28, -2 18, 14 18 C 30 18, 42 34, 58 48 Z"
      fill="url(#gradLeaf2)"
      opacity="0.88"
    />
    <!-- Center Leaf Sprout Center Core -->
    <circle cx="45" cy="48" r="5" fill="#34D399" />
    <path
      d="M45 28 C 47 38, 53 43, 62 45 C 52 47, 47 53, 45 63 C 43 53, 38 47, 28 45 C 37 43, 43 38, 45 28 Z"
      fill="#FFFFFF"
      opacity="0.8"
    />
  </g>

  <!-- Typography: Sinergi CSR -->
  <text x="110" y="55" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#072418" letter-spacing="-0.03em">
    Sinergi<tspan fill="#176B4D">CSR</tspan>
  </text>
  <!-- Tagline / Subtitle -->
  <text x="112" y="76" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748B" letter-spacing="0.22em">
    ENTERPRISE IMPACT &amp; ESG HUB
  </text>
</svg>
