<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 84" fill="none">
  <defs>
    <linearGradient id="whiteGrad1" x1="10" y1="10" x2="70" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="whiteGrad2" x1="70" y1="16" x2="16" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#34D399" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Infinity Leaf Emblem -->
  <g filter="url(#whiteGlow)">
    <path
      d="M28 42 C 14 28, 14 16, 30 16 C 44 16, 54 34, 66 48 C 76 60, 80 68, 66 68 C 52 68, 42 54, 28 42 Z"
      fill="url(#whiteGrad1)"
    />
    <path
      d="M52 42 C 66 56, 66 68, 50 68 C 36 68, 26 50, 14 36 C 4 24, 0 16, 14 16 C 28 16, 38 30, 52 42 Z"
      fill="url(#whiteGrad2)"
      opacity="0.9"
    />
    <circle cx="40" cy="42" r="4" fill="#A7F3D0" />
    <!-- Sprouting leaf tip -->
    <path
      d="M66 48 C 74 38, 80 34, 82 24 C 74 26, 68 32, 64 42 Z"
      fill="#D4F63D"
    />
  </g>

  <!-- Brand Typography -->
  <text x="96" y="50" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" letter-spacing="-0.03em">
    Sinergi<tspan fill="#D4F63D">CSR</tspan>
  </text>
  <text x="98" y="68" font-family="Plus Jakarta Sans, Inter, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#E2E8F0" letter-spacing="0.18em" opacity="0.85">
    IMPACT &amp; ESG PLATFORM
  </text>
</svg>
